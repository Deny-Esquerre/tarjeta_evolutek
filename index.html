<style>
/* Layout: one column — signal-field backdrop, physical 3D card, square action grid (wide primary + three links) */
:root{
  --navy:#191A55; --navy-hi:#262889; --navy-lo:#10113F;
  --navy-dk:#10113F;
  --ink:#16173A; --muted:#6D6E78; --line:#DFE1EA; --white:#FFFFFF; --soft:#F4F5F9;
  --display:"Montserrat",system-ui,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --col:min(calc(100vw - 32px),420px); --u:calc(var(--col) / 100);
  color-scheme:light;
}
@media (min-width:760px){:root{--col:520px;--u:5.2px}}
html,body{background:var(--white)}
body{color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#field{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
.page{position:relative;z-index:1;width:var(--col);margin:0 auto;min-height:100svh;padding-block:32px;display:flex;flex-direction:column;justify-content:center;gap:44px}
.wrap-g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- card ---------- */
.stage{perspective:1000px;touch-action:pan-y;padding:6px 0}
.card-wrap{position:relative;width:100%;aspect-ratio:85.6/53.98}
.card-shadow{position:absolute;left:7%;right:7%;bottom:-18px;height:38px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(25,26,85,.32),rgba(25,26,85,.12) 55%,transparent);
  transform:translate3d(var(--shx,0px),0,0) scaleX(var(--shs,1))}
.card{--rad:3.72%/5.9%;position:absolute;inset:0;border-radius:var(--rad);transform-style:preserve-3d;
  transform:rotateY(var(--flip,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .75s cubic-bezier(.22,1,.36,1);will-change:transform;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.card.is-live{transition:none}
.card.is-dragging{cursor:grabbing}
.card:focus-visible .face{box-shadow:0 0 0 3px var(--navy)}
.face{position:absolute;inset:0;border-radius:var(--rad);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card.is-flipped .front,.card:not(.is-flipped) .back{pointer-events:none}
.front{background:linear-gradient(155deg,#FFFFFF 0%,#F6F7FA 40%,#E6E8F0 100%);
  box-shadow:inset 0 0 0 1px rgba(25,26,85,.08),inset 0 1px 1px rgba(255,255,255,.9)}
.back{transform:rotateY(180deg);background:linear-gradient(155deg,var(--navy-hi) 0%,var(--navy) 48%,var(--navy-lo) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--white)}
.front::before,.back::before{content:"";position:absolute;inset:0;background-size:calc(var(--u)*5) calc(var(--u)*5)}
.front::before{background-image:linear-gradient(rgba(25,26,85,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(25,26,85,.045) 1px,transparent 1px)}
.back::before{background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)}
.iris{position:absolute;left:0;top:0;width:260%;height:260%;pointer-events:none;will-change:transform;
  transform:translate3d(calc(var(--ipx,50%) * -.6154),calc(var(--ipy,50%) * -.6154),0);
  background-image:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.35) 40%,rgba(25,26,85,.04) 47%,rgba(255,255,255,.25) 54%,transparent 70%)}
.back .iris{background-image:linear-gradient(112deg,transparent 30%,rgba(255,255,255,.07) 42%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 58%,transparent 70%)}
.glare{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;will-change:transform;
  transform:translate3d(calc(var(--gx,85%) - 50%),calc(var(--gy,-30%) - 50%),0);
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.5),rgba(255,255,255,0) 44%)}
.back .glare{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16),rgba(255,255,255,0) 46%)}

.f-logo{position:absolute;left:7%;top:10%;width:calc(var(--u)*34.5);height:auto;display:block}
.f-who{position:absolute;left:7%;bottom:12%;right:36%}
.f-who small{display:block;font-family:var(--mono);font-size:calc(var(--u)*2.5);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin-bottom:calc(var(--u)*1.8)}
.f-who h1{margin:0;font-family:var(--body);font-weight:500;font-size:calc(var(--u)*7.6);letter-spacing:-.01em;line-height:1;white-space:nowrap;color:var(--navy)}
.f-who p{margin:calc(var(--u)*2) 0 0;white-space:nowrap;color:var(--muted);font-size:calc(var(--u)*3.4)}
.f-qr{position:absolute;right:6.5%;bottom:11%;width:calc(var(--u)*24);height:calc(var(--u)*24);padding:calc(var(--u)*1.7);background:#fff;
  border-radius:calc(var(--u)*1.2);box-shadow:0 0 0 1px rgba(25,26,85,.1);cursor:zoom-in;border:0}
.f-qr svg{display:block;width:100%;height:100%}
.rail{position:absolute;left:0;bottom:0;height:calc(var(--u)*1.1);width:34%;background:var(--navy)}

.b-lockup{position:absolute;inset:0 0 8%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(var(--u)*2.6)}
.b-logo{width:calc(var(--u)*58);height:auto;display:block}
.b-foot{position:absolute;left:7%;right:7%;bottom:9%;display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:calc(var(--u)*2.6);letter-spacing:.02em;text-transform:uppercase}
.b-foot a{color:#D6DAF5;text-decoration:none;padding:6px 0;margin:-6px 0}
.b-foot a:hover{color:#FFFFFF;text-decoration:underline}

/* ---------- actions ---------- */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.act{position:relative;display:flex;align-items:center;gap:10px;min-height:58px;padding:0 14px;background:var(--white);color:var(--ink);
  font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;
  white-space:nowrap;transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent}
.act::before{content:"";width:6px;height:6px;background:var(--navy);flex:none;transition:background .2s}
.act .arr{margin-left:auto;width:12px;height:12px;flex:none;transition:transform .2s}
.act.add:active{background:var(--navy-dk)}
.act.add{grid-column:1/-1;min-height:78px;background:var(--navy);color:var(--white);font-size:13px;gap:14px;text-align:left}
.act.add::before{display:none}
.act.add .ico{width:26px;height:26px;flex:none;color:#FFFFFF;transition:color .2s}
.act.add small{display:block;margin-top:4px;font-family:var(--body);font-size:11px;letter-spacing:.02em;text-transform:none;color:#A9ACCB}
@media (hover:hover){
  .act:hover{background:var(--navy);color:var(--white)}
  .act:hover::before{background:var(--white)}
  .act:hover .arr{transform:translate(3px,-3px)}
  .act.add:hover{background:var(--navy-dk)}
}
.act:active{background:var(--navy);color:var(--white)}
.act:active::before{background:var(--white)}
.act:focus-visible,.qr-tools button:focus-visible,.qr-close:focus-visible{outline:3px solid var(--navy);outline-offset:2px;z-index:1}
.certs{display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*6);align-self:stretch}
.cert{width:calc(var(--u)*15);padding:0;background:none;border:0;cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.cert img{display:block;width:100%;height:auto;transition:transform .35s cubic-bezier(.22,1,.36,1)}
@media (hover:hover){.cert:hover img{transform:scale(1.06)}}
.cert:focus-visible{outline:3px solid var(--navy);outline-offset:4px;border-radius:4px}
.cert-view{position:fixed;inset:0;z-index:50;background:var(--white);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.cert-view img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 40px rgba(25,26,85,.18)}

/* ---------- QR view ---------- */
.qr-view{position:fixed;inset:0;z-index:50;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.qr-big{width:min(78vw,52svh,420px);aspect-ratio:1/1}
.qr-big svg{display:block;width:100%;height:100%}
.qr-meta{text-align:center}
.qr-meta strong{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy)}
.qr-meta span{display:block;margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.qr-tools{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);width:min(86vw,440px)}
.qr-tools button{flex:1 1 0;min-height:52px;padding:0 10px;background:var(--white);color:var(--ink);border:0;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.qr-tools button::before{content:"";width:6px;height:6px;background:var(--navy)}
.qr-tools button[aria-pressed="true"]{background:var(--navy);color:var(--white)}
.qr-tools button[aria-pressed="true"]::before{background:var(--white)}
@media (hover:hover){.qr-tools button:hover{background:var(--navy);color:var(--white)}.qr-tools button:hover::before{background:var(--white)}}
.qr-close{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--ink);cursor:pointer}
.qr-close svg{width:18px;height:18px}
.phone{font-family:var(--mono);font-size:14px;letter-spacing:.02em;color:var(--ink);user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--navy);color:var(--white);padding:12px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase;transition:opacity .2s,transform .25s cubic-bezier(.22,1,.36,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:400px){.act{padding:0 14px;font-size:11.5px}}
@media (prefers-reduced-motion:reduce){.card,.act,.act .arr,.toast{transition:none}}
</style>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- signal field backdrop ---- */
  var cv=document.getElementById('field'), cx=cv.getContext('2d'), W,H,dpr, t0=performance.now(), last=0;
  var CH=['·','·','+','=','#'], SPS=[], SW=0, SH=0;
  function sprites(){
    var fs=10.5*dpr; SW=Math.ceil(fs*1.7); SH=Math.ceil(fs*1.7); SPS=[];
    var cols=['rgba(25,26,85,.34)','rgba(25,26,85,.62)'];
    for(var c=0;c<cols.length;c++){ var set=[];
      for(var i=0;i<CH.length;i++){
        var sc=document.createElement('canvas'); sc.width=SW; sc.height=SH;
        var g=sc.getContext('2d'); g.font=fs+'px "IBM Plex Mono", monospace'; g.textAlign='center'; g.textBaseline='middle';
        g.fillStyle=cols[c]; g.fillText(CH[i],SW/2,SH/2); set.push(sc);
      }
      SPS.push(set);
    }
  }
  function size(){
    dpr=Math.min(1.5,window.devicePixelRatio||1);
    W=cv.width=Math.round(innerWidth*dpr); H=cv.height=Math.round(innerHeight*dpr); sprites();
  }
  function draw(t){
    if(t-last<30){ if(!reduce) requestAnimationFrame(draw); return; }
    last=t;
    var s=15*dpr, k=(t-t0)/1000, ox=k*26*dpr;
    cx.clearRect(0,0,W,H);
    for(var y=s/2;y<H;y+=s){
      var ny=y/H;
      for(var x=s/2;x<W;x+=s){
        var nx=(x-ox)/W;
        var v=Math.sin(nx*6.2+k*1.1)*.5+Math.sin(ny*5.1-k*.85+nx*2.4)*.5;
        v=v*.5+.5;
        var band=.5+.5*Math.sin(ny*3.4-k*.5+nx*2.2);
        var e=v*(.35+.65*band); if(e<.16) continue;
        var i=Math.min(CH.length-1,Math.floor(e*CH.length));
        cx.globalAlpha=Math.min(1,.3+e*1.1);
        cx.drawImage(SPS[i>2?1:0][i],x-SW/2,y-SH/2);
      }
    }
    cx.globalAlpha=1;
    if(!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener('resize',function(){ size(); if(reduce) draw(performance.now()); });
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ sprites(); draw(performance.now()); }); } else draw(performance.now());

  /* ---- 3D card ---- */
  var card=document.getElementById('card'), shadow=document.getElementById('shadow'), stage=document.getElementById('stage');
  var flipped=false, rx=0, ry=0, tRx=0, tRy=0, drag=null, moved=false, raf=0, ease=.2;
  function apply(){
    card.classList.toggle('is-flipped',flipped);
    card.style.setProperty('--flip',(flipped?180:0)+'deg');
    card.style.setProperty('--rx',rx+'deg'); card.style.setProperty('--ry',ry+'deg');
    shadow.style.setProperty('--shx',(-ry*1.2)+'px'); shadow.style.setProperty('--shs',1-Math.abs(rx)/90);
  }
  function light(x,y){
    card.style.setProperty('--gx',(x*100)+'%'); card.style.setProperty('--gy',(y*100)+'%');
    card.style.setProperty('--ipx',(x*100)+'%'); card.style.setProperty('--ipy',(y*100)+'%');
  }
  function step(){
    raf=0;
    var k=reduce?1:ease;
    rx+=(tRx-rx)*k; ry+=(tRy-ry)*k;
    if(Math.abs(tRx-rx)<.04&&Math.abs(tRy-ry)<.04){ rx=tRx; ry=tRy; }
    apply();
    if(rx!==tRx||ry!==tRy) raf=requestAnimationFrame(step);
    else card.classList.remove('is-live');
  }
  function live(){ card.classList.add('is-live'); if(!raf) raf=requestAnimationFrame(step); }
  function flip(){
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    card.classList.remove('is-live');
    rx=ry=tRx=tRy=0; flipped=!flipped; apply();
  }
  function rel(e){ var r=card.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; }
  stage.addEventListener('pointermove',function(e){
    if(drag||e.pointerType!=='mouse') return;
    var p=rel(e); if(p.x<-.2||p.x>1.2||p.y<-.3||p.y>1.3) return;
    if(!reduce){ ease=.18; tRy=(p.x-.5)*20*(flipped?-1:1); tRx=(.5-p.y)*14; live(); }
    light(flipped?1-p.x:p.x,p.y);
  });
  stage.addEventListener('pointerleave',function(){ if(!drag){ ease=.14; tRx=0; tRy=0; live(); } });
  card.addEventListener('pointerdown',function(e){
    if(e.target.closest('[data-nf],.f-qr')) return;
    drag={x:e.clientX,y:e.clientY,rx:rx,ry:ry}; moved=false;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
  });
  card.addEventListener('pointermove',function(e){
    if(!drag) return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!moved && Math.abs(dx)+Math.abs(dy)>6){ moved=true; card.classList.add('is-dragging'); }
    if(!moved) return;
    ease=.55;
    tRy=Math.max(-42,Math.min(42,drag.ry+dx*.4*(flipped?-1:1)));
    tRx=Math.max(-28,Math.min(28,drag.rx-dy*.34));
    var p=rel(e); light(p.x,p.y); live();
  });
  function end(cancel){
    if(!drag) return; drag=null; card.classList.remove('is-dragging');
    if(!moved && !cancel){ flip(); return; }
    ease=.16; tRx=0; tRy=0; live();
  }
  card.addEventListener('pointerup',function(){ end(false); });
  card.addEventListener('pointercancel',function(){ end(true); });
  card.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } });
  apply();

  /* ---- toast ---- */
  var toastEl=document.getElementById('toast'), tt;
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){ toastEl.classList.remove('show'); },1900); }

  /* ---- QR view ---- */
  var view=document.getElementById('qrView'), segWeb=document.getElementById('segWeb'), segVc=document.getElementById('segVc'), copyBtn=document.getElementById('copyBtn');
  var mode='web', lastFocus=null;
  function setMode(m){
    mode=m; var vc=m==='vc';
    segWeb.setAttribute('aria-pressed',!vc); segVc.setAttribute('aria-pressed',vc);
    document.getElementById('bigWeb').hidden=vc; document.getElementById('bigVc').hidden=!vc;
    document.getElementById('qrSub').textContent=vc?'Escanea para guardar el contacto':'evolutek.pe';
    document.getElementById('phoneLine').hidden=!vc;
    copyBtn.textContent=vc?'Copiar número':'Copiar enlace';
  }
  function openQr(m){ lastFocus=document.activeElement; setMode(m); view.hidden=false; document.getElementById('qrClose').focus(); }
  function closeQr(){ view.hidden=true; lastFocus&&lastFocus.focus&&lastFocus.focus(); }
  document.getElementById('openQr').addEventListener('click',function(){ openQr('web'); });
  document.getElementById('cardQr').addEventListener('click',function(e){ e.stopPropagation(); openQr('web'); });
  document.getElementById('qrClose').addEventListener('click',closeQr);
  view.addEventListener('keydown',function(e){ if(e.key==='Escape') closeQr(); });
  segWeb.addEventListener('click',function(){ setMode('web'); });
  segVc.addEventListener('click',function(){ setMode('vc'); });
  copyBtn.addEventListener('click',function(){
    var txt=mode==='vc'?PROFILE.phone:'https://evolutek.pe';
    function fail(){ toast(mode==='vc'?PROFILE.phoneDisplay:'evolutek.pe'); }
    try{ navigator.clipboard.writeText(txt).then(function(){ toast(mode==='vc'?'Número copiado':'Enlace copiado'); },fail); }catch(_){ fail(); }
  });

  /* ---- certificates ---- */
  var certView=document.getElementById('certView'), certImg=document.getElementById('certImg'), certOpen=null;
  function closeCert(){ certView.hidden=true; if(certOpen){ certOpen.focus(); certOpen=null; } }
  Array.prototype.forEach.call(document.querySelectorAll('.cert'),function(b){
    b.addEventListener('click',function(){
      var im=b.querySelector('img'); certImg.src=im.currentSrc||im.src; certImg.alt=im.alt;
      certOpen=b; certView.hidden=false; document.getElementById('certClose').focus();
    });
  });
  document.getElementById('certClose').addEventListener('click',closeCert);
  certView.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCert(); });

  /* ---- add to contacts ---- */
  var VCF=PROFILE.vcf;
  var inViewer=!!(window.claude && typeof window.claude.use==='function');
  function vcfUrl(){ return URL.createObjectURL(new Blob([VCF],{type:'text/vcard;charset=utf-8'})); }
  document.getElementById('addContact').addEventListener('click',function(){
    if(inViewer){ openQr('vc'); return; }
    var ua=navigator.userAgent;
    if(/Android/i.test(ua)){
      var fb=vcfUrl();
      location.href='intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact'
        +';S.name='+encodeURIComponent(PROFILE.name)
        +';S.phone='+encodeURIComponent(PROFILE.phone)
        +';S.email='+encodeURIComponent('administracion@evolutek.pe')
        +';S.company='+encodeURIComponent('Evolutek')
        +';S.job_title='+encodeURIComponent(PROFILE.role)
        +';S.website='+encodeURIComponent('https://evolutek.pe')
        +';S.browser_fallback_url='+encodeURIComponent(fb)+';end';
      return;
    }
    if(/iPhone|iPad|iPod/i.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/i.test(ua))){
      location.href=vcfUrl(); return;
    }
    var url=vcfUrl(), a=document.createElement('a');
    a.href=url; a.download=PROFILE.name.replace(/ /g,'-')+'-Evolutek.vcf'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
    toast('Contacto listo');
  });
})();
</script>
